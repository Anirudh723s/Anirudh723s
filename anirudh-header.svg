<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
<feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b">
<animate attributeName="stdDeviation" values="3;11;3" dur="2.6s" repeatCount="indefinite"/>
</feGaussianBlur>
<feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#0d1117" stop-opacity="0"/><stop offset=".5" stop-color="#00b4ff"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient>
</defs>
<style>
@keyframes l0{0%,8%{fill-opacity:0}12%,88%{fill-opacity:1}96%,100%{fill-opacity:0}}
.l0{animation:l0 9s infinite;fill-opacity:0}
@keyframes l1{0%,14%{fill-opacity:0}18%,88%{fill-opacity:1}96%,100%{fill-opacity:0}}
.l1{animation:l1 9s infinite;fill-opacity:0}
@keyframes l2{0%,20%{fill-opacity:0}24%,88%{fill-opacity:1}96%,100%{fill-opacity:0}}
.l2{animation:l2 9s infinite;fill-opacity:0}
@keyframes l3{0%,26%{fill-opacity:0}30%,88%{fill-opacity:1}96%,100%{fill-opacity:0}}
.l3{animation:l3 9s infinite;fill-opacity:0}
@keyframes l4{0%,32%{fill-opacity:0}36%,88%{fill-opacity:1}96%,100%{fill-opacity:0}}
.l4{animation:l4 9s infinite;fill-opacity:0}
@keyframes l5{0%,38%{fill-opacity:0}42%,88%{fill-opacity:1}96%,100%{fill-opacity:0}}
.l5{animation:l5 9s infinite;fill-opacity:0}
@keyframes l6{0%,44%{fill-opacity:0}48%,88%{fill-opacity:1}96%,100%{fill-opacity:0}}
.l6{animation:l6 9s infinite;fill-opacity:0}

.name{font-family:Georgia,'Times New Roman',serif;font-weight:bold;font-size:104px;letter-spacing:10px;fill:#00b4ff}
.star{fill:#00b4ff;animation:tw 2.6s infinite}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
</style>
<g filter="url(#glow)"><text x="450" y="125" text-anchor="middle" class="name"><tspan class="l0">A</tspan><tspan class="l1">N</tspan><tspan class="l2">I</tspan><tspan class="l3">R</tspan><tspan class="l4">U</tspan><tspan class="l5">D</tspan><tspan class="l6">H</tspan></text></g>
<path class="star" d="M110 95 l8 -22 l8 22 l22 8 l-22 8 l-8 22 l-8 -22 l-22 -8z" filter="url(#glow)"/>
<path class="star" d="M790 95 l8 -22 l8 22 l22 8 l-22 8 l-8 22 l-8 -22 l-22 -8z" filter="url(#glow)"/>
<rect x="150" y="170" width="600" height="3" fill="url(#line)"/>
</svg>